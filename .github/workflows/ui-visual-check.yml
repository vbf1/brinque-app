name: KidsLoc Visual Layout Checks

on:
  pull_request:
    paths:
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/ui-visual-check.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/ui-visual-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright (free browser automation)
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Run responsive visual checks
        run: |
          mkdir -p artifacts
          node tests/ui-visual-check.cjs

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kidsloc-visual-layout-screenshots
          path: artifacts/*.png
          if-no-files-found: warn
          retention-days: 7
