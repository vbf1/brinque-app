name: Validate marketing module
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/desktop_react/**'
      - 'supabase/migrations/**'
      - '.github/workflows/marketing-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop_react/package-lock.json
      - name: Install dependencies
        working-directory: apps/desktop_react
        run: npm ci --no-audit --no-fund
      - name: TypeScript and production build
        working-directory: apps/desktop_react
        run: npm run build
