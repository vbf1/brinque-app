name: Deploy KidsLoc temporary web preview

on:
  push:
    branches:
      - prototype/first-test-build
    paths:
      - 'apps/desktop_react/**'
      - '.github/workflows/preview-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kidsloc-pages-preview
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout prototype branch
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop_react/package-lock.json

      - name: Install dependencies
        working-directory: apps/desktop_react
        run: npm ci --no-audit --no-fund

      - name: Build web preview
        working-directory: apps/desktop_react
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/desktop_react/dist

      - name: Deploy temporary preview
        id: deployment
        uses: actions/deploy-pages@v4
