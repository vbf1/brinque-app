name: Build KidsLoc Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, 'qa/**']
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'package.json'
      - 'native-push-entry.js'
      - 'capacitor.config.json'
      - 'google-services.json'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK components
        run: yes | sdkmanager --licenses && sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Firebase Android configuration
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path("google-services.json").read_text())
          project = config.get("project_info", {}).get("project_id")
          clients = config.get("client", [])
          expected_package = "br.com.sonhokids.kidsloc"
          matches = [item for item in clients if item.get("client_info", {}).get("android_client_info", {}).get("package_name") == expected_package]
          if project != "kidsloc-app-32009":
              raise SystemExit(f"Firebase project incorreto: {project!r}")
          if not matches:
              raise SystemExit(f"google-services.json não contém o pacote Android {expected_package}")
          if not matches[0].get("client_info", {}).get("mobilesdk_app_id"):
              raise SystemExit("Firebase mobilesdk_app_id ausente.")
          if not matches[0].get("api_key"):
              raise SystemExit("Firebase API key ausente.")
          print(f"Firebase Android validado: projeto={project}, pacote={expected_package}")
          PY

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest sw.js www/
          npx esbuild native-push-entry.js --bundle --format=iife --outfile=www/native-push.bundle.js
          if [ -f notification-icon.svg ]; then cp notification-icon.svg www/; fi

      - name: Add Android project and configure Firebase
        run: |
          npx cap add android
          mkdir -p android/app
          cp google-services.json android/app/google-services.json
          python3 - <<'PY'
          from pathlib import Path
          root = Path("android/build.gradle")
          text = root.read_text()
          plugin = "id 'com.google.gms.google-services' version '4.4.4' apply false"
          if plugin not in text:
              text = text.replace("plugins {", "plugins {\n    " + plugin, 1)
          root.write_text(text)
          app = Path("android/app/build.gradle")
          text = app.read_text()
          app_plugin = "id 'com.google.gms.google-services'"
          if app_plugin not in text:
              text = text.replace("plugins {", "plugins {\n    " + app_plugin, 1)
          app.write_text(text)
          PY
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:processDebugGoogleServices --no-daemon
          ./gradlew assembleDebug --no-daemon

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: kidsloc-app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
