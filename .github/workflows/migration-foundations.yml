name: Validate migration foundations

on:
  push:
    branches:
      - 'migration/**'
  pull_request:
    paths:
      - 'apps/mobile_flutter/**'
      - 'apps/desktop_react/**'
      - 'docs/MIGRACAO-ARQUITETURA.md'
      - '.github/workflows/migration-foundations.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Resolve Flutter dependencies
        working-directory: apps/mobile_flutter
        run: flutter pub get
      - name: Analyze Flutter
        working-directory: apps/mobile_flutter
        run: flutter analyze
      - name: Test Flutter
        working-directory: apps/mobile_flutter
        run: flutter test

  react:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop_react/package.json
      - name: Install React dependencies
        working-directory: apps/desktop_react
        run: npm install --no-audit --no-fund
      - name: Build React
        working-directory: apps/desktop_react
        run: npm run build
