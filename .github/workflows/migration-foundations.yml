name: Validate migration foundations

on:
  push:
    branches:
      - 'migration/**'
  pull_request:
    paths:
      - 'apps/mobile_flutter/**'
      - 'apps/desktop_react/**'
      - 'docs/MIGRACAO-ARQUITETURA.md'
      - '.github/workflows/migration-foundations.yml'
  workflow_dispatch:

concurrency:
  group: migration-foundations-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Resolve Flutter dependencies
        working-directory: apps/mobile_flutter
        run: flutter pub get
      - name: Analyze Flutter
        working-directory: apps/mobile_flutter
        run: flutter analyze
      - name: Test Flutter
        working-directory: apps/mobile_flutter
        run: flutter test

  react:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop_react/package.json
      - name: Install React dependencies
        working-directory: apps/desktop_react
        run: npm install --no-audit --no-fund
      - name: Build React
        working-directory: apps/desktop_react
        run: npm run build

  lockfiles:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate pinned dependency lockfiles
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --prefix apps/desktop_react
          cd apps/mobile_flutter
          flutter pub get
          cd ../..
      - name: Commit lockfiles to migration branch
        run: |
          git add apps/desktop_react/package-lock.json apps/mobile_flutter/pubspec.lock
          if git diff --cached --quiet; then
            echo "Lockfiles already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: lock Flutter and React dependencies"
          git push origin "HEAD:${GITHUB_REF_NAME}"
